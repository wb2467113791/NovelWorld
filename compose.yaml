services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: novelworld
      MYSQL_USER: novelworld
      MYSQL_PASSWORD: novelworld
      MYSQL_ROOT_PASSWORD: local-root-password
    ports: ["127.0.0.1:3306:3306"]
    volumes: ["novelworld_mysql:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u novelworld -pnovelworld"]
      interval: 5s
      retries: 20
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["novelworld_redis:/data"]
    command: ["redis-server", "--appendonly", "yes"]
volumes:
  novelworld_mysql:
  novelworld_redis:
