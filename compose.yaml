services:
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:${NOVELWORLD_REDIS_PORT:-6380}:6379"]
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: novelworld
      MYSQL_USER: novelworld
      MYSQL_PASSWORD: novelworld
      MYSQL_ROOT_PASSWORD: local-root-password
    ports: ["127.0.0.1:3307:3306"]
    volumes: ["novelworld_mysql:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u novelworld -pnovelworld"]
      interval: 5s
      retries: 20
volumes:
  novelworld_mysql:
