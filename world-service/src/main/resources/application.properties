server.port=8080
server.address=127.0.0.1
spring.ai.mcp.server.name=novelworld-world
spring.ai.mcp.server.version=2.0.0
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.type=SYNC
spring.datasource.url=${NOVELWORLD_JDBC_URL:jdbc:mysql://127.0.0.1:3307/novelworld?useUnicode=true&characterEncoding=utf8}
spring.datasource.username=${NOVELWORLD_DB_USER:novelworld}
spring.datasource.password=${NOVELWORLD_DB_PASSWORD:novelworld}
spring.data.redis.host=${NOVELWORLD_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${NOVELWORLD_REDIS_PORT:6380}
spring.sql.init.mode=always
novelworld.agent.url=${NOVELWORLD_AGENT_URL:http://127.0.0.1:8001}
novelworld.web.user=${NOVELWORLD_WEB_USER:author}
novelworld.web.password=${NOVELWORLD_WEB_PASSWORD:}
